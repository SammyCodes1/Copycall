name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the scan only reads the repo.
permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the
      # comment records which release the SHA belongs to.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal repo: no GITLEAKS_LICENSE needed (organisations need one).
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1 # same version as the local pre-commit hook
          GITLEAKS_ENABLE_COMMENTS: "false" # would need pull-requests: write
